<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Daily Slide Mahjong</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/df2e2e/ffffff?text=🀄">
    
    <style>
        :root {
            --bg-color: #1e293b;
            --board-color: #0f172a;
            --empty-slot: #1e293b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        header {
            text-align: center;
            width: 100%;
            margin-top: 10px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        #score-board {
            font-size: 1rem;
            opacity: 0.8;
        }

        #game-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            background-color: var(--board-color);
            border-radius: 12px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        .tile {
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.1rem; 
            font-weight: bold;
            color: #0f172a; 
            box-shadow: 0 4px 0 rgba(0,0,0,0.25), 0 6px 10px rgba(0,0,0,0.2);
            transition: transform 0.15s ease-in-out;
            position: relative;
            touch-action: none; 
        }

        .tile.empty {
            background-color: var(--empty-slot);
            border-radius: 6px;
            opacity: 0.15;
            border: 1px dashed rgba(255,255,255,0.1);
            box-shadow: none;
        }

        @keyframes hint-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .tile.hint-source {
            animation: hint-pulse 0.6s ease-in-out infinite;
            outline: 3px solid #fbbf24;
            outline-offset: -3px;
        }

        .tile.empty.hint-target {
            opacity: 0.6;
            border: 2px dashed #fbbf24;
            background-color: rgba(251, 191, 36, 0.25);
        }

        footer {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <header>
        <h1>Shift Mahjong Daily</h1>
        <div id="score-board">Tiles Remaining: <span id="tile-count">24</span></div>
    </header>

    <div id="game-container"></div>

    <footer>
        <button onclick="initGame()">New Board</button>
        <button onclick="showHint()">Hint</button>
    </footer>

    <script>
        const GRID_SIZE = 6;
        const container = document.getElementById('game-container');
        const tileCountEl = document.getElementById('tile-count');
        
        const SYMBOLS = ['🀀', '🀁', '🀂', '🀃', '🀄', '🀅', '🀆', '🀇', '🀏', '🀕', '🀟', '🀤'];
        
        const COLOR_PALETTE = [
            '#f87171', '#fb923c', '#fbbf24', '#fde047', 
            '#a3e635', '#4ade80', '#2dd4bf', '#38bdf8', 
            '#60a5fa', '#818cf8', '#c084fc', '#f472b6'
        ];

        let grid = [];
        let touchStartX = 0;
        let touchStartY = 0;

        function initGame() {
            grid = Array(GRID_SIZE * GRID_SIZE).fill(null);
            
            let deck = [];
            SYMBOLS.forEach((sym, idx) => {
                deck.push({ text: sym, color: COLOR_PALETTE[idx] }); 
                deck.push({ text: sym, color: COLOR_PALETTE[idx] }); 
            });

            deck.sort(() => Math.random() - 0.5);

            let positions = [];
            while(positions.length < 24) {
                let r = Math.floor(Math.random() * 36);
                if(!positions.includes(r)) positions.push(r);
            }

            positions.forEach((pos, index) => {
                grid[pos] = deck[index];
            });

            ensureSolvable();
            renderBoard();
        }

        function renderBoard() {
            container.innerHTML = '';
            let remaining = 0;

            grid.forEach((tileData, index) => {
                const tileDiv = document.createElement('div');
                if (tileData) {
                    remaining++;
                    tileDiv.className = 'tile';
                    tileDiv.textContent = tileData.text;
                    tileDiv.style.background = tileData.color;
                    
                    tileDiv.addEventListener('touchstart', (e) => handleTouchStart(e), { passive: true });
                    tileDiv.addEventListener('touchend', (e) => handleTouchEnd(e, index), { passive: true });
                } else {
                    tileDiv.className = 'tile empty';
                }
                container.appendChild(tileDiv);
            });

            tileCountEl.textContent = remaining;
            if (remaining === 0) {
                setTimeout(() => alert('🎉 Board Cleared! Nice job!'), 300);
            }
        }

        function handleTouchStart(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }

        function handleTouchEnd(e, index) {
            const deltaX = e.changedTouches[0].screenX - touchStartX;
            const deltaY = e.changedTouches[0].screenY - touchStartY;
            const swipeThreshold = 30; 

            if (Math.abs(deltaX) < swipeThreshold && Math.abs(deltaY) < swipeThreshold) {
                return; 
            }

            // Figure out how many grid cells the swipe actually covered, so a
            // longer swipe moves a block further (not just one square).
            const firstTile = container.firstElementChild;
            const tileRect = firstTile.getBoundingClientRect();
            const gridGap = 6; // matches the #game-container gap in the CSS
            const cellPitch = tileRect.width + gridGap;

            // Try the move on a scratch copy of the board first — nothing touches
            // the real board yet.
            const testGrid = grid.map(item => item ? { ...item } : null);
            let moved = false;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                const direction = deltaX > 0 ? 1 : -1;
                const requestedDistance = Math.max(1, Math.round(Math.abs(deltaX) / cellPitch));
                moved = processPartialSlide(testGrid, index, direction, 'horizontal', requestedDistance);
            } else {
                const direction = deltaY > 0 ? GRID_SIZE : -GRID_SIZE;
                const requestedDistance = Math.max(1, Math.round(Math.abs(deltaY) / cellPitch));
                moved = processPartialSlide(testGrid, index, direction, 'vertical', requestedDistance);
            }

            // Only commit the move if it actually results in a match. If it
            // doesn't, the real board is never touched — no flicker, no snapback,
            // the tile simply doesn't move.
            if (moved && hasLineOfSightMatch(testGrid)) {
                grid = testGrid;
                renderBoard();
                setTimeout(() => {
                    checkMatches(false);
                }, 100);
            }
        }

        // Shared by processPartialSlide and the hint finder. For a tile at
        // startIndex, returns the contiguous block of tiles that would move
        // together (movingBlockIndices) and how many open squares are ahead of
        // that block before it's blocked by another tile or the edge (maxDistance).
        function getSlideInfo(targetGrid, startIndex, step, axis) {
            let row = Math.floor(startIndex / GRID_SIZE);

            let movingBlockIndices = [startIndex];
            let current = startIndex;

            while (true) {
                current += step;
                if (current < 0 || current >= GRID_SIZE * GRID_SIZE) break;
                if (axis === 'horizontal' && Math.floor(current / GRID_SIZE) !== row) break;
                if (targetGrid[current] !== null) {
                    movingBlockIndices.push(current);
                } else {
                    break;
                }
            }

            let lastBlockIdx = movingBlockIndices[movingBlockIndices.length - 1];
            let maxDistance = 0;
            let cursor = lastBlockIdx + step;

            while (
                cursor >= 0 && cursor < GRID_SIZE * GRID_SIZE &&
                !(axis === 'horizontal' && Math.floor(cursor / GRID_SIZE) !== row) &&
                targetGrid[cursor] === null
            ) {
                maxDistance++;
                cursor += step;
            }

            return { movingBlockIndices, maxDistance };
        }

        function processPartialSlide(targetGrid, startIndex, step, axis, requestedDistance) {
            const { movingBlockIndices, maxDistance } = getSlideInfo(targetGrid, startIndex, step, axis);
            const distance = Math.min(requestedDistance, maxDistance);
            if (distance === 0) return false;

            let reverseBlock = [...movingBlockIndices].reverse();
            reverseBlock.forEach(idx => {
                targetGrid[idx + step * distance] = targetGrid[idx];
                targetGrid[idx] = null;
            });

            return true;
        }

        // Read-only check: does this board (row/column line-of-sight, gaps allowed)
        // contain a matching pair anywhere? Used to validate a move before it's
        // committed to the real board.
        function hasLineOfSightMatch(targetGrid) {
            for (let r = 0; r < GRID_SIZE; r++) {
                let lastTileIdx = -1;
                for (let c = 0; c < GRID_SIZE; c++) {
                    let currentIdx = r * GRID_SIZE + c;
                    if (targetGrid[currentIdx] !== null) {
                        if (lastTileIdx !== -1 && targetGrid[currentIdx].text === targetGrid[lastTileIdx].text) {
                            return true;
                        }
                        lastTileIdx = currentIdx;
                    }
                }
            }

            for (let c = 0; c < GRID_SIZE; c++) {
                let lastTileIdx = -1;
                for (let r = 0; r < GRID_SIZE; r++) {
                    let currentIdx = r * GRID_SIZE + c;
                    if (targetGrid[currentIdx] !== null) {
                        if (lastTileIdx !== -1 && targetGrid[currentIdx].text === targetGrid[lastTileIdx].text) {
                            return true;
                        }
                        lastTileIdx = currentIdx;
                    }
                }
            }

            return false;
        }

        // Looks for one tile whose block can slide some distance, in some
        // direction, to produce a match — exactly the kind of move a swipe is
        // allowed to make. Returns null if no such move exists anywhere on the
        // board.
        function findHint() {
            const directions = [
                { step: 1, axis: 'horizontal' },
                { step: -1, axis: 'horizontal' },
                { step: GRID_SIZE, axis: 'vertical' },
                { step: -GRID_SIZE, axis: 'vertical' }
            ];

            for (let index = 0; index < grid.length; index++) {
                if (grid[index] === null) continue;

                for (const { step, axis } of directions) {
                    const { movingBlockIndices, maxDistance } = getSlideInfo(grid, index, step, axis);

                    for (let distance = 1; distance <= maxDistance; distance++) {
                        const testGrid = grid.map(t => t ? { ...t } : null);
                        const reverseBlock = [...movingBlockIndices].reverse();
                        reverseBlock.forEach(idx => {
                            testGrid[idx + step * distance] = testGrid[idx];
                            testGrid[idx] = null;
                        });

                        if (hasLineOfSightMatch(testGrid)) {
                            return { blockIndices: movingBlockIndices, step, distance };
                        }
                    }
                }
            }

            return null;
        }

        // Randomly redistributes the tiles currently on the board across all 36
        // squares (their values are kept, only their positions change).
        function shuffleTilesInPlace() {
            const tileValues = grid.filter(t => t !== null);
            let positions = Array.from({ length: GRID_SIZE * GRID_SIZE }, (_, i) => i);

            for (let i = positions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [positions[i], positions[j]] = [positions[j], positions[i]];
            }

            const newGrid = Array(GRID_SIZE * GRID_SIZE).fill(null);
            tileValues.forEach((tileData, i) => {
                newGrid[positions[i]] = tileData;
            });

            grid = newGrid;
        }

        // Guarantees the board is never left with zero legal moves: if there's
        // already a match sitting in line of sight, or some move can create one,
        // it's fine as-is. Otherwise the tiles get reshuffled (repeatedly, if
        // needed) until a move is possible again.
        function ensureSolvable(maxAttempts = 500) {
            let attempts = 0;
            while (!hasLineOfSightMatch(grid) && findHint() === null && attempts < maxAttempts) {
                shuffleTilesInPlace();
                attempts++;
            }
        }

        function showHint() {
            const hint = findHint();

            if (!hint) {
                // Shouldn't normally happen since the board is kept solvable, but
                // reshuffle as a safety net just in case.
                shuffleTilesInPlace();
                ensureSolvable();
                renderBoard();
                return;
            }

            const cells = container.children;
            const destinationIndices = hint.blockIndices.map(idx => idx + hint.step * hint.distance);

            hint.blockIndices.forEach(idx => cells[idx] && cells[idx].classList.add('hint-source'));
            destinationIndices.forEach(idx => cells[idx] && cells[idx].classList.add('hint-target'));

            setTimeout(() => {
                hint.blockIndices.forEach(idx => cells[idx] && cells[idx].classList.remove('hint-source'));
                destinationIndices.forEach(idx => cells[idx] && cells[idx].classList.remove('hint-target'));
            }, 1500);
        }

        function checkMatches(dryRun = false) {
            let matched = false;
            let toRemove = new Set();
            
            // Row Scan for Line-of-Sight
            for (let r = 0; r < GRID_SIZE; r++) {
                let lastTileIdx = -1;
                for (let c = 0; c < GRID_SIZE; c++) {
                    let currentIdx = r * GRID_SIZE + c;
                    if (grid[currentIdx] !== null) {
                        if (lastTileIdx !== -1 && grid[currentIdx].text === grid[lastTileIdx].text) {
                            toRemove.add(currentIdx);
                            toRemove.add(lastTileIdx);
                            matched = true;
                        }
                        lastTileIdx = currentIdx;
                    }
                }
            }

            // Column Scan for Line-of-Sight
            for (let c = 0; c < GRID_SIZE; c++) {
                let lastTileIdx = -1;
                for (let r = 0; r < GRID_SIZE; r++) {
                    let currentIdx = r * GRID_SIZE + c;
                    if (grid[currentIdx] !== null) {
                        if (lastTileIdx !== -1 && grid[currentIdx].text === grid[lastTileIdx].text) {
                            toRemove.add(currentIdx);
                            toRemove.add(lastTileIdx);
                            matched = true;
                        }
                        lastTileIdx = currentIdx;
                    }
                }
            }

            if (dryRun) return matched;

            toRemove.forEach(idx => {
                grid[idx] = null;
            });

            if (matched) {
                renderBoard();
                setTimeout(() => checkMatches(false), 150); 
            } else if (grid.some(t => t !== null)) {
                // No more chain-reaction matches to clear. Make sure the player
                // still has at least one legal move; reshuffle in place if not.
                const hadNoMoves = !hasLineOfSightMatch(grid) && findHint() === null;
                if (hadNoMoves) {
                    ensureSolvable();
                    renderBoard();
                }
            }
        }

        initGame();
    </script>
</body>
</html>
